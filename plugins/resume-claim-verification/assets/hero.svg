<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Resume Claim Verification</title>
  <desc id="desc">Evidence-based resume review for Claude and Codex with clear PDF reports.</desc>
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0F2740"/><stop offset=".58" stop-color="#174B70"/><stop offset="1" stop-color="#246B9E"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#071522" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#hero)"/>
  <circle cx="1070" cy="42" r="185" fill="#4B91BD" opacity=".16"/><circle cx="1120" cy="340" r="235" fill="#071D31" opacity=".18"/>
  <g transform="translate(72 68)" filter="url(#shadow)">
    <rect width="188" height="224" rx="24" fill="#F8FBFD"/>
    <path d="M40 54h108M40 92h78M40 130h92" stroke="#91B4C9" stroke-width="12" stroke-linecap="round"/>
    <circle cx="124" cy="157" r="48" fill="#EAF3F8" stroke="#16324F" stroke-width="12"/>
    <path d="m157 191 38 38" stroke="#16324F" stroke-width="18" stroke-linecap="round"/>
    <path d="m99 157 18 18 33-40" fill="none" stroke="#27845A" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="310" y="112" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700">Resume Claim Verification</text>
  <text x="310" y="157" fill="#DCEBF4" font-family="Arial, Helvetica, sans-serif" font-size="23">Clear resume checks for Claude and Codex</text>
  <text x="310" y="203" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="19">Assess claims. Explain uncertainty. Generate a clear PDF.</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">
    <rect x="310" y="238" width="142" height="40" rx="20" fill="#DDF2E4"/><text x="333" y="264" fill="#174B36">SUPPORTED</text>
    <rect x="466" y="238" width="148" height="40" rx="20" fill="#E8F0FA"/><text x="490" y="264" fill="#244B72">UNVERIFIED</text>
    <rect x="628" y="238" width="188" height="40" rx="20" fill="#FFF0C7"/><text x="649" y="264" fill="#6F5613">CLARIFICATION</text>
    <rect x="830" y="238" width="194" height="40" rx="20" fill="#FADDDD"/><text x="850" y="264" fill="#762E2E">INCONSISTENCY</text>
  </g>
  <text x="310" y="316" fill="#BFD8E7" font-family="Arial, Helvetica, sans-serif" font-size="16">No fake score. Missing evidence is not proof. A person makes the final call.</text>
</svg>
